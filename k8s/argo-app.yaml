apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-front
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://gitlab.planet9.uk/devops/k8s-manifests.git'
    targetRevision: main
    path: demo-front
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-front
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
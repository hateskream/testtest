apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-front
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'git@gitlab.planet9.uk:i88/i88.git'
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-front
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
deploy:
  stage: deploy
  tags:
    - kuber
  image: bitnami/kubectl:latest
  script:
    - kubectl apply -f k8s/deployment.yaml
    - kubectl apply -f k8s/service.yaml
    - kubectl apply -f k8s/ingress.yaml
  only:
    - main
  after_script:
    - rm -f /tmp/kubeconfig

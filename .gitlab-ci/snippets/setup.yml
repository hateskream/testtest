install_dependencies:
  stage: setup
  image:
    name: node:24.7.0-alpine
    pull_policy: if-not-present

  script:
    - npm install
    - npm ci

  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull-push

  artifacts:
    paths:
      - node_modules/
    expire_in: 1h

  rules:
    - if: $SKIP_ALL_JOBS == "true"
      when: never
    - when: on_success

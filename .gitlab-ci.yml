workflow:
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[ci skip\]/ || $CI_COMMIT_MESSAGE =~ /\[skip ci\]/'
      when: never
    - when: always

variables:
  GIT_CLEAN_FLAGS: -ffdx -e node_modules/
  IMAGE_TAG: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME-$CI_PIPELINE_IID
  GITLAB_TOKEN: $GITLAB_TOKEN
  MANIFEST_BRANCH_REPO: main
  DEPLOYMENT_PATH: "demo-front/sandbox/vasiliy/deployment.yaml"

include:
  - local: "/.gitlab-ci/snippets/setup.yml"
  - local: "/.gitlab-ci/snippets/lint.yml"

stages:
  - setup
  - lint
  - deploy
  - build

deploy:
  stage: deploy
  image: alpine:3.21
  script:
    - apk add --no-cache git
    - git init repo
    - cd repo
    - git config user.email "ci@planet9.uk"
    - git config user.name "GitLab CI"
    - git remote add origin https://oauth2:$GITLAB_TOKEN@gitlab.planet9.uk/devops/k8s-manifests.git

    - git config core.sparseCheckout true
    - echo "$DEPLOYMENT_PATH" > .git/info/sparse-checkout

    - git fetch origin $MANIFEST_BRANCH_REPO
    - git checkout -b $MANIFEST_BRANCH_REPO origin/$MANIFEST_BRANCH_REPO

    - SANITIZED_IMAGE_TAG=$(echo "$IMAGE_TAG" | tr '/' '-')
    - 'sed -i "s|image: $CI_REGISTRY_IMAGE:.*|image: $CI_REGISTRY_IMAGE:$SANITIZED_IMAGE_TAG|" $DEPLOYMENT_PATH'
    - echo "$IMAGE_TAG"
    - echo "$SANITIZED_IMAGE_TAG"

    - git add "$DEPLOYMENT_PATH"
    - git commit -m "Update image tag to $IMAGE_TAG [ci skip]" || echo "No changes to commit"
    - git push origin $MANIFEST_BRANCH_REPO

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_AUTHOR != "GitLab CI <ci@planet9.uk>" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
      variables:
        DEPLOYMENT_PATH: "demo-front/deployment.yaml"
#    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_AUTHOR != "GitLab CI <ci@planet9.uk>" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "sandbox/vasiliy"'
#      variables:
#        DEPLOYMENT_PATH: "demo-front/sandbox/vasiliy/deployment.yaml"
    - when: never
    

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

  script:
    - SANITIZED_IMAGE_TAG=$(echo "$IMAGE_TAG" | tr '/' '-')
    - docker build -t $CI_REGISTRY_IMAGE:$SANITIZED_IMAGE_TAG .
    - docker push $CI_REGISTRY_IMAGE:$SANITIZED_IMAGE_TAG
  
  #rules:
  #  - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_AUTHOR != "GitLab CI <ci@planet9.uk>"'

variables:
  GIT_CLEAN_FLAGS: -ffdx -e frontend/node_modules/
  IMAGE_TAG: $CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA

include:
  - local: "/frontend/.gitlab-ci/snippets/setup.yml"
  - local: "/frontend/.gitlab-ci/snippets/lint.yml"

before_script:
  - cd frontend

stages:
  - setup
  - lint
  - build
  - deploy

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

  script:
    - cd frontend
    - docker build -t $CI_REGISTRY_IMAGE:$IMAGE_TAG .
    - docker push $CI_REGISTRY_IMAGE:$IMAGE_TAG    
  
  only:
    - main

deploy:
  image: bitnami/kubectl:1.32
  script:
    - kubectl set image deployment/demo-front demo-front=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA -n demo-front
    - kubectl rollout restart deployment/demo-front -n demo-front
  
  only:
    - main
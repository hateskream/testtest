variables:
  CI_PROJECT_DIR: "/frontend/"

include:
  - local: "/frontend/.gitlab-ci/snippets/setup.yml"
  - local: "/frontend/.gitlab-ci/snippets/lint.yml"

stages:
  - setup
  - lint
  - build
#  - deploy

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind

  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

  script:
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest    
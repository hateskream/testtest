variables:
  GIT_CLEAN_FLAGS: -ffdx -e frontend/node_modules/
  IMAGE_TAG: $CI_COMMIT_REF_NAME-$CI_PIPELINE_IID

include:
  - local: "/frontend/.gitlab-ci/snippets/setup.yml"
  - local: "/frontend/.gitlab-ci/snippets/lint.yml"

before_script:
  - cd frontend

stages:
  - setup
  - lint
  - build
  - deploy

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

  script:
    - cd frontend
    - docker build -t $CI_REGISTRY_IMAGE:$IMAGE_TAG .
    - docker push $CI_REGISTRY_IMAGE:$IMAGE_TAG    
  
  only:
    - main

deploy:
  stage: deploy
  image: curlimages/curl

  script:
    - 'curl -H "PRIVATE-TOKEN: $GITLAB_TOKEN" "https://gitlab.planet9.uk/api/v4/projects/$CI_PROJECT_ID/repository/files/k8s%2Fdeployment.yaml/raw?ref=main" -o image-tag.yaml'
    - 'sed -i "s|image: $CI_REGISTRY_IMAGE:.*|image: $CI_REGISTRY_IMAGE:$IMAGE_TAG|" deployment.yaml'
    - 'curl -X PUT -H "PRIVATE-TOKEN: $GITLAB_TOKEN" -H "Content-Type: application/json" "https://gitlab.planet9.uk/api/v4/projects/$CI_PROJECT_ID/repository/files/k8s%2Fdeployment.yaml" -d "{\"branch\":\"main\",\"content\":\"$(cat image-tag.yaml | sed "s/\"/\\\\\"/g")\",\"commit_message\":\"Update image tag to $IMAGE_TAG\"}"'
  
  variables:
    GITLAB_TOKEN: $GITLAB_TOKEN

  only:
    - main
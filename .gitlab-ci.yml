variables:
  GIT_CLEAN_FLAGS: -ffdx -e frontend/node_modules/

include:
  - local: "/frontend/.gitlab-ci/snippets/setup.yml"
  - local: "/frontend/.gitlab-ci/snippets/lint.yml"

before_script:
  - cd frontend

stages:
  - setup
  - lint
  - build
#  - deploy

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

  script:
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest    